name: 'Build utilities'

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'

defaults:
  run:
    shell: pwsh

jobs:
  build-utilities:
    name: 'Build utilities'
    env:
      VULKAN_SDK_VERSION: 1.3.290.0

    strategy:
      matrix:
        system:
          - windows-latest
        preset:
          - Utilities
        platform:
          - x64
        config:
          - Debug
          - RelWithDebInfo
          - Release

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
          restore-keys: |
            ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
            ${{ matrix.preset }}-NuGet-
          path: |
            ~/.nuget/packages
      - name: Prepare Vulkan SDK directory
        run: |
          New-Item -ItemType Directory -Path C:/VulkanSDK -ErrorAction SilentlyContinue | Out-Null
          Write-Host "Vulkan target version: $env:VULKAN_SDK_VERSION"

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v4
        with:
          path: C:/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (if cache miss)
        if: steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
        run: |
          $version = $env:VULKAN_SDK_VERSION
          $installer = "VulkanSDK-$version-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/$installer"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -Wait -ArgumentList @('--accept-licenses','--default-answer','--confirm-command','install')
          Remove-Item $installer
          if (-not (Test-Path "C:/VulkanSDK/$version/Include/vulkan/vulkan.h")) { throw "Vulkan headers not found after install" }

      - name: Export Vulkan env
        run: |
          $version = $env:VULKAN_SDK_VERSION
          echo "VULKAN_SDK=C:/VulkanSDK/$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VK_SDK_PATH=C:/VulkanSDK/$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "C:/VulkanSDK/$version/Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Using Vulkan SDK at C:/VulkanSDK/$version"

      - name: Configure utilities
        run: |
          cmake `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }} `
            -DIXRAY_CI=ON

      - name: Build utilities
        run: |
          cmake `
            --build `
            --target TextureCloner xrCompress mp_configs_verifyer mp_gpprof_server mp_balancer mp_screenshots_info xrLevelBuilder EFC `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}-${{ matrix.config }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: utilities-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.exe
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.dll

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        if: ${{ matrix.config != 'Release' }}
        with:
          name: utilities-symbols-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.pdb

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: utilities-libraries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/lib/${{ matrix.config }}/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: ${{ (matrix.config == 'Debug' && matrix.platform == 'x64') }}
        with:
          name: utilities-packages-${{ matrix.system }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/packages/

  build-targets:
    name: 'Build targets'

    strategy:
      matrix:
        system:
          - ubuntu-latest
        preset:
          - Targets
        platform:
          - x64
        config:
          - Debug
          - RelWithDebInfo
          - Release

    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Vulkan dev packages (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            vulkan-tools \
            vulkan-validationlayers \
            vulkan-utility-libraries-dev \
            spirv-tools \
            spirv-headers \
            mesa-vulkan-drivers \
            libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev

      - name: Install LLVM/Clang 18 and libc++
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get update
          sudo apt-get install -y clang-18 lldb-18 lld-18 libc++-18-dev libc++abi-18-dev

      - name: Set Clang 18 as default
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-18 100
          
      - name: Verify versions
        run: |
          clang++-18 --version
          ls -l /usr/include/c++/v1  # Проверка наличия libc++18
        
      - name: Install SDL3 Linux build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxinerama-dev \
          libxss-dev \
          libwayland-dev \
          libdrm-dev \
          libgbm-dev \
          libudev-dev \
          libpipewire-0.3-dev \
          libibus-1.0-dev \
          libdbus-1-dev \
          libtbb-dev \
          liblzo2-2 \
          liblzo2-dev \
          libyaml-cpp-dev

      - name: Install Mono + NuGet (Linux targets)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y mono-complete
          NUGET_VERSION=5.11.0
          wget -q "https://dist.nuget.org/win-x86-commandline/v${NUGET_VERSION}/nuget.exe" -O nuget.exe
          sudo mv nuget.exe /usr/local/bin/nuget.exe
          sudo chmod +x /usr/local/bin/nuget.exe
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'mono /usr/local/bin/nuget.exe "$@"' > /tmp/nuget-wrapper
          sudo mv /tmp/nuget-wrapper /usr/local/bin/nuget
          sudo chmod +x /usr/local/bin/nuget
          mkdir -p "$GITHUB_WORKSPACE/.nuget/packages" build/x64/Targets-Linux/packages || true
          echo "NUGET_PACKAGES=$GITHUB_WORKSPACE/.nuget/packages" >> $GITHUB_ENV
          echo "NuGet pinned version:"; nuget help | head -n1 || true

      - name: Restore NuGet packages (Linux targets)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          echo "NuGet version:"; nuget help | head -n1 || true
          echo "NUGET_PACKAGES=$NUGET_PACKAGES"
          ls -ld "$NUGET_PACKAGES" || true
          mkdir -p build/x64/Targets-Linux || true
          if ! nuget restore cmake/linux/Packages.config -SolutionDirectory build/x64/Targets-Linux -Verbosity minimal; then
            echo "Primary restore failed, trying fallback to build root";
            nuget restore cmake/linux/Packages.config -SolutionDirectory build -Verbosity detailed || {
              echo "Restore failed after fallback"; exit 1;
            }
          fi
          echo "Listing restored LuaJIT path:"; ls -1 build/x64/Targets-Linux/packages/IXRay.Packages.LuaJIT.Runtimes.linux-x64.2023.8.23.1-open/runtimes/linux-x64/native/ 2>/dev/null || true

      - name: Configure targets
        run: |
          cmake \
            -S . \
            -B build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }} \
            -G "Ninja Multi-Config" \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DIXRAY_UTILS=ON \
            -DIXRAY_CI=ON \
            -DIXRAY_USE_R1=OFF \
            -DIXRAY_USE_R2=OFF \
            -DIXRAY_USE_VK=ON \
            -DIXRAY_FORCE_NO_D3D=ON

      - name: Dump feature flags (Linux targets)
        if: runner.os == 'Linux'
        run: |
          echo '==== CMake Feature Flags Snapshot ===='
          grep -E 'IXRAY_USE_R1|IXRAY_USE_R2|IXRAY_USE_VK|IXRAY_FORCE_NO_D3D' build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/CMakeCache.txt || true
          echo '======================================='

      - name: Build targets
        run: |
          cmake \
            --build build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }} \
            --target TextureCloner xrCompress \
            --config ${{ matrix.config }} \
            -j$(nproc)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: targets-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/
            !build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.pdb
            !build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.debug
          if-no-files-found: ignore

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        if: ${{ matrix.config != 'Release' }}
        with:
          name: targets-symbols-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.pdb
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.debug
          if-no-files-found: ignore

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: targets-libraries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/lib/${{ matrix.config }}/
          if-no-files-found: ignore

  pack-assets:
    name: 'Pack assets'

    needs:
      - build-utilities

    strategy:
      matrix:
        system:
          - windows-latest

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup compressor
        uses: ixray-team/setup-compressor@v0.1
        with:
          codebase: '1.6-stcop'

      - name: Generate patch
        run: |
          ${{ github.workspace }}/util/generate-patch.bat `
            xrCompress.exe
          type `
            *.log
          move `
            ${{ github.workspace }}/gamedata `
            ${{ github.workspace }}/gamedata_full
          move `
            ${{ github.workspace }}/patch `
            ${{ github.workspace }}/gamedata

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: utilities-assets-${{ github.sha }}
          path: |
            gamedata/
            .xrignore
            fs*.ltx
          include-hidden-files: true

  publish-utilities:
    name: 'Publish utilities'

    needs:
      - pack-assets

    strategy:
      matrix:
        system:
          - windows-latest
        platform:
          - x64
        preset:
          - Utilities
        config:
          - RelWithDebInfo

    runs-on: ${{ matrix.system }}

    steps:
      - name: Get utilities
        uses: actions/download-artifact@v5
        with:
          name: utilities-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/

      - name: Get assets
        uses: actions/download-artifact@v5
        with:
          name: utilities-assets-${{ github.sha }}
          path: ./

      - name: Move files
        run: |
          mkdir `
            ${{ github.workspace }}/bin
          move `
            ${{ github.workspace }}/build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.* `
            ${{ github.workspace }}/bin

      - name: Upload utilities
        uses: actions/upload-artifact@v4
        with:
          name: utilities-publish-${{ matrix.system }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            bin/
            gamedata/
            .xrignore
            fs*.ltx
          include-hidden-files: true
