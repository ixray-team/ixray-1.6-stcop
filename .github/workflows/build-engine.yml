name: 'Build engine'

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'

defaults:
  run:
    shell: pwsh

jobs:
  build-engine:
    name: 'Build engine'

    strategy:
      matrix:
        system:
          - windows-latest
        preset:
          - Engine
        platform:
          - x64
        config:
          - Debug
          - RelWithDebInfo
          - Release

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
          restore-keys: |
            ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
            ${{ matrix.preset }}-NuGet-
          path: |
            ~/.nuget/packages

      - name: Install Vulkan SDK
        run: |
          # Download and install Vulkan SDK
          $vulkanUrl = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          $installerPath = "$env:TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri $vulkanUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait

          # Find the installed Vulkan SDK version
          $vulkanBasePath = "C:\VulkanSDK"
          $latestVersion = Get-ChildItem -Path $vulkanBasePath -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($latestVersion) {
            $vulkanSdkPath = Join-Path $vulkanBasePath $latestVersion.Name
            $vulkanBinPath = Join-Path $vulkanSdkPath "Bin"
            $vulkanLibPath = Join-Path $vulkanSdkPath "Lib"
            $vulkanIncludePath = Join-Path $vulkanSdkPath "Include"

            # Set environment variables
            echo "VULKAN_SDK=$vulkanSdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "VK_SDK_PATH=$vulkanSdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append

            # Add to PATH
            echo "$vulkanBinPath" | Out-File -FilePath $env:GITHUB_PATH -Append

            Write-Host "Vulkan SDK installed at: $vulkanSdkPath"
            Write-Host "VULKAN_SDK: $env:VULKAN_SDK"
          } else {
            Write-Error "Vulkan SDK installation failed - directory not found"
            exit 1
          }

      - name: Configure engine
        run: |
          cmake `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}

      - name: Build engine
        run: |
          cmake `
            --build `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}-${{ matrix.config }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: engine-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.exe
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.dll

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        if: ${{ matrix.config != 'Release' }}
        with:
          name: engine-symbols-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.pdb

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: engine-libraries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/lib/${{ matrix.config }}/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: ${{ (matrix.config == 'Debug' && matrix.platform == 'x64') }}
        with:
          name: engine-packages-${{ matrix.system }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/packages/

  pack-assets:
    name: 'Pack assets'

    needs:
      - build-engine

    strategy:
      matrix:
        system:
          - windows-latest

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup compressor
        uses: ixray-team/setup-compressor@v0.1
        with:
          codebase: '1.6-stcop'

      - name: Generate patch
        run: |
          ${{ github.workspace }}/util/generate-patch.bat `
            xrCompress.exe
          type `
            *.log
          move `
            ${{ github.workspace }}/gamedata `
            ${{ github.workspace }}/gamedata_full
          move `
            ${{ github.workspace }}/patch `
            ${{ github.workspace }}/gamedata

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: engine-assets-${{ github.sha }}
          path: |
            gamedata/
            .xrignore
            fsgame.ltx
          include-hidden-files: true

  publish-engine:
    name: 'Publish engine'

    needs:
      - pack-assets

    strategy:
      matrix:
        system:
          - windows-latest
        platform:
          - x64
        preset:
          - Engine
        config:
          - RelWithDebInfo

    runs-on: ${{ matrix.system }}

    steps:
      - name: Get engine
        uses: actions/download-artifact@v5
        with:
          name: engine-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/

      - name: Get assets
        uses: actions/download-artifact@v5
        with:
          name: engine-assets-${{ github.sha }}
          path: ./

      - name: Move files
        run: |
          mkdir `
            ${{ github.workspace }}/bin
          move `
            ${{ github.workspace }}/build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.* `
            ${{ github.workspace }}/bin

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-publish-${{ matrix.system }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            bin/
            gamedata/
            .xrignore
            fsgame.ltx
          include-hidden-files: true
