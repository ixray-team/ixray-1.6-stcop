name: 'Build engine'

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'

defaults:
  run:
    shell: pwsh

jobs:
  build-engine:
    name: 'Build engine'
    env:
      IXRAY_USE_VK: ON

    strategy:
      matrix:
        system:
          - windows-latest
          - ubuntu-latest
        preset:
          - Engine
        platform:
          - x64
        config:
          - Debug
          - RelWithDebInfo
          - Release

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "Installing pkg-config (pkgconfiglite)"
          choco install -y pkgconfiglite
          if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            Write-Host "pkg-config not found in PATH after install; trying default location"
            $fallback = 'C:/ProgramData/chocolatey/lib/pkgconfiglite/tools'
            if (Test-Path $fallback) { echo "$fallback" | Out-File -FilePath $env:GITHUB_PATH -Append }
          }
          pkg-config --version
      - name: Set Vulkan SDK version (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VULKAN_SDK_VERSION=1.3.290.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: CMake cache (build dir)
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/
          key: cmake-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.preset }}-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.preset }}-${{ matrix.config }}-
            cmake-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.preset }}-
            cmake-${{ runner.os }}-${{ matrix.platform }}-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ninja-build mesa-common-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libvulkan-dev vulkan-utils
          pkg-config --version

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
          restore-keys: |
            ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
            ${{ matrix.preset }}-NuGet-
          path: |
            ~/.nuget/packages

      - name: Prepare Vulkan SDK directory
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path C:/VulkanSDK -ErrorAction SilentlyContinue | Out-Null
          Write-Host "Vulkan target version: $env:VULKAN_SDK_VERSION"

      - name: Cache Vulkan SDK
        if: runner.os == 'Windows'
        id: cache-vulkan-sdk
        uses: actions/cache@v4
        with:
          path: C:/VulkanSDK/1.3.290.0
          key: vulkan-sdk-${{ runner.os }}-1.3.290.0

      - name: Install Vulkan SDK (if cache miss)
        if: runner.os == 'Windows' && steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
        run: |
          $version = '1.3.290.0'
          $installer = "VulkanSDK-$version-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/$installer"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -Wait -ArgumentList @('--accept-licenses','--default-answer','--confirm-command','install')
          Remove-Item $installer
          if (-not (Test-Path "C:/VulkanSDK/$version/Include/vulkan/vulkan.h")) { throw "Vulkan headers not found after install" }

      - name: Export Vulkan env (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = '1.3.290.0'
          echo "VULKAN_SDK=C:/VulkanSDK/$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VK_SDK_PATH=C:/VulkanSDK/$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "C:/VulkanSDK/$version/Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Using Vulkan SDK at C:/VulkanSDK/$version"


      - name: Configure engine (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }} `
            -DIXRAY_USE_VK=${{ env.IXRAY_USE_VK }}

      - name: Configure engine (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake \
            --preset "${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}" \
            -DIXRAY_USE_VK=${IXRAY_USE_VK}

      - name: Build engine (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake `
            --build `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}-${{ matrix.config }}

      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --build --preset "${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}-${{ matrix.config }}"

      - name: Upload binaries (Windows)
        if: runner.os == 'Windows'
      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --build --preset "${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}-${{ matrix.config }}"

      - name: Upload binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: engine-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.exe
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.dll

      - name: Upload binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: engine-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*

      - name: Upload symbols (Windows)
        if: runner.os == 'Windows' && matrix.config != 'Release'
      - name: Upload binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: engine-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*

      - name: Upload symbols (Windows)
        if: runner.os == 'Windows' && matrix.config != 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: engine-symbols-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.pdb

      - name: Upload libraries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: engine-libraries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/lib/${{ matrix.config }}/

      - name: Upload libraries (Linux)
        if: runner.os == 'Linux'
      - name: Upload libraries (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: engine-libraries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/lib/${{ matrix.config }}/

      - name: Upload libraries (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: engine-libraries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/lib/${{ matrix.config }}/

      - name: Upload packages (Windows Debug x64 only)
        if: runner.os == 'Windows' && matrix.config == 'Debug' && matrix.platform == 'x64'
      - name: Upload packages (Windows Debug x64 only)
        if: runner.os == 'Windows' && matrix.config == 'Debug' && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: engine-packages-${{ matrix.system }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/packages/

  pack-assets:
    name: 'Pack assets'

    needs:
      - build-engine

    strategy:
      matrix:
        system:
          - windows-latest

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup compressor
        uses: ixray-team/setup-compressor@v0.1
        with:
          codebase: '1.6-stcop'

      - name: Generate patch
        run: |
          ${{ github.workspace }}/util/generate-patch.bat `
            xrCompress.exe
          type `
            *.log
          move `
            ${{ github.workspace }}/gamedata `
            ${{ github.workspace }}/gamedata_full
          move `
            ${{ github.workspace }}/patch `
            ${{ github.workspace }}/gamedata

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: engine-assets-${{ github.sha }}
          path: |
            gamedata/
            .xrignore
            fsgame.ltx
          include-hidden-files: true

  publish-engine:
    name: 'Publish engine'

    needs:
      - pack-assets

    strategy:
      matrix:
        system:
          - windows-latest
        platform:
          - x64
        preset:
          - Engine
        config:
          - RelWithDebInfo

    runs-on: ${{ matrix.system }}

    steps:
      - name: Get engine
        uses: actions/download-artifact@v5
        with:
          name: engine-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/

      - name: Get assets
        uses: actions/download-artifact@v5
        with:
          name: engine-assets-${{ github.sha }}
          path: ./

      - name: Move files
        run: |
          mkdir `
            ${{ github.workspace }}/bin
          move `
            ${{ github.workspace }}/build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.* `
            ${{ github.workspace }}/bin

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine-publish-${{ matrix.system }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            bin/
            gamedata/
            .xrignore
            fsgame.ltx
          include-hidden-files: true
