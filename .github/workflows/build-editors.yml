name: 'Build editors'

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'

defaults:
  run:
    shell: pwsh

jobs:
  build-editors:
    name: 'Build editors'

    strategy:
      matrix:
        system:
          - windows-latest
        preset:
          - Editors
        platform:
          - x64
        config:
          - Debug
          - RelWithDebInfo

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
          restore-keys: |
            ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
            ${{ matrix.preset }}-NuGet-
          path: |
            ~/.nuget/packages

      - name: Install Vulkan SDK
        run: |
          function Install-VulkanSdk {
            param([string]$VersionTag = 'latest')
            $base = 'https://sdk.lunarg.com/sdk/download'
            $url = "$base/$VersionTag/windows/vulkan-sdk.exe"
            $inst = "$env:TEMP\vulkan-sdk.exe"
            Write-Host "Downloading Vulkan SDK from $url"
            Invoke-WebRequest -Uri $url -OutFile $inst -UseBasicParsing
            Start-Process -FilePath $inst -ArgumentList '/S' -Wait -NoNewWindow
            $root = 'C:\VulkanSDK'
            if (-not (Test-Path $root)) { throw "VulkanSDK root not found after install" }
            $versions = Get-ChildItem $root -Directory | Sort-Object Name -Descending
            if (-not $versions) { throw "No Vulkan SDK versions detected under $root" }
            $chosen = $versions[0].FullName
            if (-not (Test-Path (Join-Path $chosen 'Include/vulkan/vulkan.h'))) { throw "vulkan.h missing in $chosen" }
            echo "VULKAN_SDK=$chosen" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "VK_SDK_PATH=$chosen" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo (Join-Path $chosen 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Append
            Write-Host "Installed Vulkan SDK at $chosen"
          }
          try {
            Install-VulkanSdk -VersionTag 'latest'
          } catch {
            Write-Warning "Primary install failed: $_. Trying Chocolatey fallback..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            choco install vulkan-sdk -y --no-progress || choco upgrade vulkan-sdk -y --no-progress
            $root = 'C:\VulkanSDK'
            $versions = Get-ChildItem $root -Directory | Sort-Object Name -Descending
            if ($versions) {
              $chosen = $versions[0].FullName
              if (Test-Path (Join-Path $chosen 'Include/vulkan/vulkan.h')) {
                echo "VULKAN_SDK=$chosen" | Out-File -FilePath $env:GITHUB_ENV -Append
                echo "VK_SDK_PATH=$chosen" | Out-File -FilePath $env:GITHUB_ENV -Append
                echo (Join-Path $chosen 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Append
                Write-Host "Chocolatey Vulkan SDK at $chosen"
              } else { throw "Fallback Vulkan install missing headers" }
            } else { throw "No Vulkan SDK versions after fallback" }
          }

      - name: Configure editors
        run: |
          cmake `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}

      - name: Build editors
        run: |
          cmake `
            --build `
            --target LevelEditor ActorEditor ParticlesEditor ShaderEditor `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-${{ runner.os }}-${{ matrix.config }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: editors-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.exe
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.dll

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        if: ${{ matrix.config != 'Release' }}
        with:
          name: editors-symbols-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.pdb

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: editors-libraries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/lib/${{ matrix.config }}/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        if: ${{ (matrix.config == 'Debug' && matrix.platform == 'x64') }}
        with:
          name: editors-packages-${{ matrix.system }}-${{ github.sha }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/packages/

  pack-assets:
    name: 'Pack assets'

    needs:
      - build-editors

    strategy:
      matrix:
        system:
          - windows-latest

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup compressor
        uses: ixray-team/setup-compressor@v0.1
        with:
          codebase: '1.6-stcop'

      - name: Generate patch
        run: |
          ${{ github.workspace }}/util/generate-patch.bat `
            xrCompress.exe
          type `
            *.log
          move `
            ${{ github.workspace }}/gamedata `
            ${{ github.workspace }}/gamedata_full
          move `
            ${{ github.workspace }}/patch `
            ${{ github.workspace }}/gamedata

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: editors-assets-${{ github.sha }}
          path: |
            gamedata/
            rawdata/
            .xrignore
            ActorEditorLevel.cform
            fs*.ltx
          include-hidden-files: true

  publish-editors:
    name: 'Publish editors'

    needs:
      - pack-assets

    strategy:
      matrix:
        system:
          - windows-latest
        platform:
          - x64
        preset:
          - Editors
        config:
          - RelWithDebInfo

    runs-on: ${{ matrix.system }}

    steps:
      - name: Get editors
        uses: actions/download-artifact@v5
        with:
          name: editors-binaries-${{ matrix.system }}-${{ matrix.platform }}-${{ matrix.config }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/

      - name: Get assets
        uses: actions/download-artifact@v5
        with:
          name: editors-assets-${{ github.sha }}
          path: ./

      - name: Move files
        run: |
          mkdir `
            ${{ github.workspace }}/bin
          move `
            ${{ github.workspace }}/build/${{ matrix.platform }}/${{ matrix.preset }}-${{ runner.os }}/bin/${{ matrix.config }}/*.* `
            ${{ github.workspace }}/bin

      - name: Upload editors
        uses: actions/upload-artifact@v4
        with:
          name: editors-publish-${{ matrix.system }}-${{ matrix.platform }}-${{ github.sha }}
          path: |
            bin/
            gamedata/
            rawdata/
            .xrignore
            ActorEditorLevel.cform
            fs*.ltx
          include-hidden-files: true
