name: 'Build game package'

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build-game:
    name: 'Build game package'
    runs-on: [self-hosted, windows, x64, winefixes]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "release" -and "${{ github.event.release.tag_name }}" -ne "") {
            $version = "${{ github.event.release.tag_name }}"
          }
          $version = $version -replace "_dev$", ""
          $version = $version -replace "_", "-"
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare build paths
        id: paths
        run: |
          $buildDir = "b\\x64\\s"
          "build_dir=$buildDir" >> $env:GITHUB_OUTPUT
          "bin_dir=$buildDir\\bin\\Release" >> $env:GITHUB_OUTPUT

      - name: Cache packages
        uses: actions/cache@v5
        with:
          key: Server-NuGet-${{ hashFiles('**/Packages.config') }}
          restore-keys: |
            Server-NuGet-${{ hashFiles('**/Packages.config') }}
            Server-NuGet-
          path: |
            ~/.nuget/packages

      - name: Reset local package folder
        run: |
          $pkgDir = "${{ steps.paths.outputs.build_dir }}\\packages"
          if (Test-Path $pkgDir) {
            Remove-Item $pkgDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

      - name: Configure server
        run: cmake --preset Server-x64-Windows -B "${{ steps.paths.outputs.build_dir }}"

      - name: Build server
        run: cmake --build "${{ steps.paths.outputs.build_dir }}" --config Release --parallel

      - name: Setup compressor
        uses: ixray-team/setup-compressor@v0.1
        with:
          codebase: '1.6-stcop'

      - name: Generate patch
        run: |
          ${{ github.workspace }}/util/generate-patch.bat xrCompress.exe
          type *.log
          move ${{ github.workspace }}/gamedata ${{ github.workspace }}/gamedata_full
          move ${{ github.workspace }}/patch ${{ github.workspace }}/gamedata

      - name: Pack game archive
        id: package
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $archiveName = "ixray-1.6-$version-engine-x64-game.zip"
          $publishDir = "$env:GITHUB_WORKSPACE\\publish"
          $stageDir = "$publishDir\\package-game"
          $archivePath = "$publishDir\\$archiveName"

          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          New-Item -ItemType Directory -Path "$stageDir\\bin" -Force | Out-Null
          Copy-Item "${{ steps.paths.outputs.bin_dir }}\\*.exe" "$stageDir\\bin\\" -Force
          Copy-Item "${{ steps.paths.outputs.bin_dir }}\\*.dll" "$stageDir\\bin\\" -Force
          Copy-Item "gamedata" "$stageDir\\gamedata" -Recurse -Force
          Copy-Item "fsgame.ltx" "$stageDir\\fsgame.ltx" -Force
          Copy-Item ".xrignore" "$stageDir\\.xrignore" -Force

          $zipTool = "$env:ProgramFiles\\7-Zip\\7z.exe"
          if (Test-Path $zipTool) {
            Push-Location $stageDir
            & $zipTool a -tzip $archivePath "bin" "gamedata" "fsgame.ltx" ".xrignore" -xr!*.pdb
            Pop-Location
          } else {
            Compress-Archive -Path "$stageDir\\*" -DestinationPath $archivePath -Force
          }

          "archive=$archiveName" >> $env:GITHUB_OUTPUT
          "path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: warn

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.path }}
