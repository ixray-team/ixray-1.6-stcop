name: 'Non-Unity build'

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'

defaults:
  run:
    shell: pwsh

jobs:
  build-engine:
    name: 'Build engine'
    env:
      VULKAN_SDK_VERSION: 1.3.290.0

    strategy:
      matrix:
        system:
          - windows-latest
        preset:
          - Engine
        platform:
          - x64
        config:
          - Debug
          - RelWithDebInfo
          - Release

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
          restore-keys: |
            ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
            ${{ matrix.preset }}-NuGet-
          path: |
            ~/.nuget/packages

      - name: Install Vulkan SDK
        run: |
          # Download and install Vulkan SDK
          $vulkanUrl = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          $installerPath = "$env:TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri $vulkanUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait

          # Find the installed Vulkan SDK version
          $vulkanBasePath = "C:\VulkanSDK"
          $latestVersion = Get-ChildItem -Path $vulkanBasePath -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($latestVersion) {
            $vulkanSdkPath = Join-Path $vulkanBasePath $latestVersion.Name
            $vulkanBinPath = Join-Path $vulkanSdkPath "Bin"
            $vulkanLibPath = Join-Path $vulkanSdkPath "Lib"
            $vulkanIncludePath = Join-Path $vulkanSdkPath "Include"

            # Set environment variables
            echo "VULKAN_SDK=$vulkanSdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "VK_SDK_PATH=$vulkanSdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append

            # Add to PATH
            echo "$vulkanBinPath" | Out-File -FilePath $env:GITHUB_PATH -Append

            Write-Host "Vulkan SDK installed at: $vulkanSdkPath"
            Write-Host "VULKAN_SDK: $env:VULKAN_SDK"
          } else {
            Write-Error "Vulkan SDK installation failed - directory not found"
            exit 1
          }

      - name: Configure engine
        run: |
          cmake `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-NonUnity

      - name: Build engine
        run: |
          cmake `
            --build `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-NonUnity-${{ matrix.config }}
