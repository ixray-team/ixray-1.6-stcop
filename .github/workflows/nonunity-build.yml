name: 'Non-Unity build'

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'gamedata/**'
      - 'sdk/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - '**/*.ltx'
      - '**/*.json'

defaults:
  run:
    shell: pwsh

jobs:
  build-engine:
    name: 'Build engine'
    env:
      VULKAN_SDK_VERSION: 1.3.290.0

    strategy:
      matrix:
        system:
          - windows-latest
        preset:
          - Engine
        platform:
          - x64
        config:
          - Debug
          - RelWithDebInfo
          - Release

    runs-on: ${{ matrix.system }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
          restore-keys: |
            ${{ matrix.preset }}-NuGet-${{ hashFiles('**/Packages.config') }}
            ${{ matrix.preset }}-NuGet-
          path: |
            ~/.nuget/packages

      - name: Install Vulkan SDK
        run: |
          # Download and install Vulkan SDK
          $vulkanUrl = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          $installerPath = "$env:TEMP\vulkan-sdk.exe"
          Invoke-WebRequest -Uri $vulkanUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          # Add Vulkan SDK to PATH
          $vulkanPath = "C:\VulkanSDK\*\Bin"
          $env:Path += ";$vulkanPath"
          echo "VULKAN_SDK=C:\VulkanSDK\*" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure engine
        run: |
          cmake `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-NonUnity

      - name: Build engine
        run: |
          cmake `
            --build `
            --preset ${{ matrix.preset }}-${{ matrix.platform }}-NonUnity-${{ matrix.config }}
