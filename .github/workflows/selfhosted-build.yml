name: Build (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        type: choice
        default: Release
        options:
          - Debug
          - RelWithDebInfo
          - Release
      clean_build:
        description: Clean rebuild (slower)
        required: true
        type: boolean
        default: false
      target:
        description: CMake target to build
        required: true
        type: string
        default: ALL_BUILD
      parallel:
        description: Build jobs (0 = auto from runner CPU count)
        required: true
        type: string
        default: "0"
      upload_symbols:
        description: Upload PDB symbols
        required: true
        type: boolean
        default: false
      artifact_retention_days:
        description: Artifact retention days
        required: true
        type: number
        default: 7
      upload_artifacts:
        description: Upload build artifacts
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, x64, winefixes]
    timeout-minutes: 120
    concurrency:
      group: selfhosted-build-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Keep local build trees on self-hosted runner for true incremental builds.
          clean: false

      - name: Prune workspace (keep build cache)
        shell: pwsh
        run: |
          git clean -ffd -e b/ -e build/

      - name: Prepare build variables
        id: vars
        shell: pwsh
        run: |
          $buildDir = "b/x64/e"
          $parallel = "${{ inputs.parallel }}"
          if ([string]::IsNullOrWhiteSpace($parallel) -or $parallel -eq "0") {
            $parallel = $env:NUMBER_OF_PROCESSORS
          }
          "build_dir=$buildDir" >> $env:GITHUB_OUTPUT
          "parallel=$parallel" >> $env:GITHUB_OUTPUT
          "bin_dir=$buildDir/bin/${{ inputs.configuration }}" >> $env:GITHUB_OUTPUT

      - name: Clean build directory
        if: ${{ inputs.clean_build }}
        shell: pwsh
        run: |
          if (Test-Path "${{ steps.vars.outputs.build_dir }}") {
            Remove-Item "${{ steps.vars.outputs.build_dir }}" -Recurse -Force
          }

      - name: Reset preset NuGet package folder
        shell: pwsh
        run: |
          $pkgPath = "${{ steps.vars.outputs.build_dir }}/packages"
          if (Test-Path $pkgPath) {
            Remove-Item $pkgPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $pkgPath | Out-Null

      - name: Configure
        shell: pwsh
        run: cmake --preset Engine-x64-Windows -B "${{ steps.vars.outputs.build_dir }}"

      - name: Build (incremental)
        if: ${{ !inputs.clean_build }}
        shell: pwsh
        run: cmake --build "${{ steps.vars.outputs.build_dir }}" --config "${{ inputs.configuration }}" --target "${{ inputs.target }}" --parallel ${{ steps.vars.outputs.parallel }}

      - name: Build (clean)
        if: ${{ inputs.clean_build }}
        shell: pwsh
        run: cmake --build "${{ steps.vars.outputs.build_dir }}" --config "${{ inputs.configuration }}" --target "${{ inputs.target }}" --clean-first --parallel ${{ steps.vars.outputs.parallel }}

      - name: Upload binaries
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: ixray-bin-${{ inputs.configuration }}-${{ github.sha }}
          path: |
            ${{ steps.vars.outputs.bin_dir }}/*.exe
            ${{ steps.vars.outputs.bin_dir }}/*.dll
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload symbols
        if: ${{ inputs.upload_artifacts && inputs.upload_symbols }}
        uses: actions/upload-artifact@v6
        with:
          name: ixray-pdb-${{ inputs.configuration }}-${{ github.sha }}
          path: |
            ${{ steps.vars.outputs.bin_dir }}/*.pdb
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.artifact_retention_days }}
